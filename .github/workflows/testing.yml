name: "Testing"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Only one run per PR at a time: a new push cancels the PR's in-flight run, so
# superseded runs don't tie up scarce macOS runners. Pushes to main are never
# cancelled, so every commit on main gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tox:
    name: "Tests"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os:
          - ubuntu-latest
          - macos-latest
          # - windows-latest
        # macOS runners are capacity-constrained, so only test the oldest and
        # newest supported Python there; Ubuntu covers every version.
        exclude:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install unrar
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get -y install unrar
          else
            echo "$RUNNER_OS not supported"
          fi
        shell: bash
      - name: Install project
        run: uv sync --group test
      - name: Run tests
        run: uv run pytest
